description: Input Processor for cirque pinnacle touch pad

compatible: "zmk,input-processor-cirque"

include: ip_zero_param.yaml

properties:

  edge-scroll-margin-h-pct:
    type: int
    default: 22

  edge-scroll-margin-v-pct:
    type: int
    default: 16

  edge-scroll-segment:
    type: int
    default: 48

  session-end-idle-ms:
    type: int
    default: 20

  sync-rel-xy-ms:
    type: int
    default: 1

  sync-rel-v-ms:
    type: int
    default: 15
